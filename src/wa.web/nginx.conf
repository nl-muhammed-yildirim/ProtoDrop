server {
    listen 5173;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: every non-file route falls back to index.html (App reads window.location.pathname).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable — cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
