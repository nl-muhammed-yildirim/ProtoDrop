# T-051-03 — PR gate (F-FND-003, FR-051-1/4/5). Job set mirrors AGENT.md §4 1:1;
# adding a job requires updating both files. No secrets at M0 (OIDC federation later, TA-12.2).
name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  # AGENT.md §4: cd src/wa.web && npm run lint
  lint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/wa.web/package-lock.json
      - working-directory: src/wa.web
        run: npm ci
      - name: eslint
        working-directory: src/wa.web
        run: npm run lint
      # EC-051-1: prettier gated until its dev-dep lands (T-003 note); eslint is the active web linter at M0.
      - name: prettier
        if: false
        working-directory: src/wa.web
        run: npx prettier --check .

  # AGENT.md §4 (determinism via T-051-01 .gitattributes): enforces the repo .editorconfig (root + src/) on every PR into main or develop.
  lint-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet format src/wa.slnx --verify-no-changes

  # AGENT.md §4: dotnet test tests/wa.domain.unit + tests/wa.application.unit + tests/wa.workers.unit (100% pass gate).
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test tests/wa.domain.unit
      - run: dotnet test tests/wa.application.unit
      - run: dotnet test tests/wa.workers.unit

  # AGENT.md §4: dotnet test tests/wa.api.integration (Testcontainers; runners have Docker — EC-051-2).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test tests/wa.api.integration

  # AGENT.md §4: tsc typecheck + eslint + test:run (one-shot) + build. Gzip size is reference only at M0 (EC-051-4).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 -> undici 8 requires Node >= 22 (vitest loads undici via jsdom).
          node-version: 22
          cache: npm
          cache-dependency-path: src/wa.web/package-lock.json
      - working-directory: src/wa.web
        run: npm ci
      - name: tsc typecheck
        working-directory: src/wa.web
        run: npx tsc -b
      - name: eslint
        working-directory: src/wa.web
        run: npm run lint
      - name: vitest (one-shot)
        working-directory: src/wa.web
        run: npm run test:run
      - name: build
        working-directory: src/wa.web
        run: npm run build
      - name: Report gzip size (reference only, TA-8.4 budgets are not a hard gate at M0)
        working-directory: src/wa.web
        run: |
          total=0
          while IFS= read -r f; do
            s=$(gzip -c "$f" | wc -c)
            total=$((total + s))
          done < <(find dist -type f)
          echo "dist gzip total: ${total} bytes"

  # AGENT.md §4 (T-015-03, FR-015-2): token-diff parity check — plain node script over tokens.css; no npm install needed.
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-theme-tokens.mjs

  # AGENT.md §4 (T-016-06, FR-016-4): contrast check — WCAG ratios from tokens.css, both themes; gated core pairs ≥ 4.5:1.
  contrast-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-contrast.mjs

  # AGENT.md §4 (T-012-05, EC-012-3 / AC-012-3): telemetry PII guard — plain node script over src/**/*.cs + wa.web call sites; selftest proves seeded violations fail.
  pii-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-telemetry-pii.mjs
      - run: node scripts/check-telemetry-pii.mjs selftest

  # FR-051-2: multi-stage build, tagged wa-api:ci-<sha>; no push at M0 (push gated on AZURE_CONTAINER_REGISTRY, E-003).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build wa-api image
        run: docker build -f src/wa.api/Dockerfile . -t "wa-api:ci-${GITHUB_SHA}"

  # AGENT.md §4 (CHORE-infra-cd): Bicep compiles (main + every env param file). Runners ship the az CLI.
  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install
      - run: az bicep build --file infra/bicep/main.bicep --stdout > /dev/null
      - run: for p in infra/bicep/main/*.bicepparam; do az bicep build-params --file "$p" --stdout > /dev/null; done

  # CHORE-deploy-hardening: the SPA image builds, nginx renders the CSP template and every path carries the headers.
  docker-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build wa-web image
        run: docker build -f src/wa.web/Dockerfile . -t wa-web:ci --build-arg VITE_WA_API_BASE=/api/v1
      - name: Run and check security headers
        run: |
          docker run -d --name web -p 5173:5173 -e WA_API_ORIGIN="'self'" -e WA_BLOB_ORIGIN=https://example.blob.core.windows.net wa-web:ci
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:5173/ && break; sleep 1; done
          asset=$(curl -fsS http://localhost:5173/ | grep -oE '/assets/[^"]+\.js' | head -1)
          [ -n "$asset" ] || { echo "no /assets/*.js found in index.html" >&2; docker logs web; exit 1; }
          for path in / "$asset"; do
            h=$(curl -fsS -D - -o /dev/null "http://localhost:5173$path")
            echo "== $path"; echo "$h"
            for k in content-security-policy x-content-type-options referrer-policy x-frame-options permissions-policy; do
              grep -qi "^$k:" <<<"$h" || { echo "missing $k on $path" >&2; docker logs web; exit 1; }
            done
            grep -qi "https://example.blob.core.windows.net" <<<"$h" || { echo "WA_BLOB_ORIGIN not rendered on $path" >&2; docker logs web; exit 1; }
          done
